<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adoleta Moda e Variedades</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
      color: #333333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: 32px 24px;
      border-radius: 28px;
      border: 3px solid #ff4081;
      box-shadow: 0 15px 35px rgba(255, 64, 129, 0.25);
      text-align: center;
    }

    .profile-img-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 16px;
    }

    .profile-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 4px solid #00e5ff;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 6px;
      color: #d81b60;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ff1744;
      margin-bottom: 4px;
    }

    p {
      font-size: 0.85rem;
      color: #555555;
      margin-bottom: 24px;
      font-weight: 600;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 20px;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 800;
      border-radius: 16px;
      transition: all 0.25s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Botão do WhatsApp */
    .btn-whatsapp {
      background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
      border: 2px solid #ffffff;
      box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4);
    }

    .btn-whatsapp:hover {
      transform: scale(1.03);
      box-shadow: 0 12px 25px rgba(37, 211, 102, 0.6);
    }

    /* Botão da Localização */
    .btn-maps {
      background: linear-gradient(135deg, #e91e63 0%, #9c27b0 100%);
      border: 2px solid #ffffff;
      box-shadow: 0 8px 20px rgba(233, 30, 99, 0.4);
    }

    .btn-maps:hover {
      transform: scale(1.03);
      box-shadow: 0 12px 25px rgba(233, 30, 99, 0.6);
    }

    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="profile-img-wrapper">
      <img src="https://i.ibb.co/5gjr367d/831222365-18643692178046449-2230766669912117490-n.jpg" alt="Adoleta Moda e Variedades" class="profile-img">
    </div>

    <h1>ADOLETA</h1>
    <div class="subtitle">Moda e Variedades 🛍️✨</div>
    <p>Maquiagens • Moda Infantil e Juvenil</p>

    <div class="links">
      <!-- Botão do WhatsApp -->
      <a href="https://wa.me/5562984663253?text=Olá!%20Vim%20pelo%20Instagram%20e%20gostaria%20de%20mais%20informações!" target="_blank" class="btn btn-whatsapp">
        💬 FALE CONOSCO NO WHATSAPP
      </a>

      <!-- Botão da Localização (Adicione/Substitua o link do Google Maps no href abaixo caso precise) -->
      <a href="https://maps.google.com" target="_blank" class="btn btn-maps">
        📍 NOSSA LOCALIZAÇÃO
      </a>
    </div>
  </div>

</body>
</html>
